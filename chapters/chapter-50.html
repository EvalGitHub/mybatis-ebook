<section class="chapter" id="chapter-50" data-chapter="50">
  <h1>3、创建MyBatis的核心配置文件</h1>
  <div class="chapter-content">
<p>习惯上命名为mybatis-config.xml，这个文件名仅仅只是建议，并非强制要求。将来整合Spring
之后，这个配置文件可以省略，所以大家操作时可以直接复制、粘贴。
核心配置文件主要用于配置连接数据库的环境以及MyBatis的全局配置信息
更多Java –大数据 – 前端 – UI/UE - Android - 人工智能资料下载，可访问百度：尚硅谷官网(www.atguigu.com)</p>
<p>核心配置文件存放的位置是src/main/resources目录下</p>
<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE configuration
PUBLIC "-//mybatis.org//DTD Config 3.0//EN"
"http://mybatis.org/dtd/mybatis-3-config.dtd">
<p><configuration></p>
<!--设置连接数据库的环境-->
<p><environments default="development">
<environment id="development">
<transactionManager type="JDBC"/>
<dataSource type="POOLED">
<property name="driver" value="com.mysql.jdbc.Driver"/>
<property name="url"
value="jdbc:mysql://localhost:3306/MyBatis"/>
<property name="username" value="root"/>
<property name="password" value="123456"/>
</dataSource>
</environment>
</environments></p>
<!--引入映射文件-->
<p><mappers>
<mapper resource="mappers/UserMapper.xml"/>
</mappers>
</configuration></p>
  </div>
</section>

<section class="chapter" id="chapter-85" data-chapter="85">
  <h1>2、where</h1>
  <div class="chapter-content">
<p><select id="getEmpListByMoreTJ2" resultType="Emp">
select * from t_emp
<where>
<if test="ename != '' and ename != null">
ename = #{ename}
</if>
<if test="age != '' and age != null">
and age = #{age}
</if>
<if test="sex != '' and sex != null">
and sex = #{sex}
</if>
</where>
</select>
where和if一般结合使用：
a&gt;若where标签中的if条件都不满足，则where标签没有任何功能，即不会添加where关键字
b&gt;若where标签中的if条件满足，则where标签会自动添加where关键字，并将条件最前方多余的
and去掉
注意：where标签不能去掉条件最后多余的and</p>
  </div>
</section>
